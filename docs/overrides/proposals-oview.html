{% extends "main.html" %}

{% block extrahead %}
{{ super() }}
<style>
  .md-sidebar--secondary {
    display: none !important;
  }

  .md-content {
    max-width: none !important;
  }

  .prop-quarter h2 {
    cursor: pointer;
    user-select: none;
  }

  .prop-quarter h2:hover {
    opacity: 0.7;
  }

  .prop-quarter h2::after {
    content: " \25BC";
    font-size: 0.75em;
    opacity: 0.5;
    margin-left: 6px;
    transition: transform 0.2s;
    display: inline-block;
  }

  .prop-quarter.prop-quarter-collapsed h2::after {
    transform: rotate(-90deg);
  }

  .prop-quarter.prop-quarter-collapsed > *:not(h2):not(.prop-quarter-summary) {
    display: none;
  }

  .prop-quarter-summary {
    display: none;
    font-size: 13px;
    color: var(--md-default-fg-color--light);
    margin: 0 0 8px;
  }

  .prop-quarter.prop-quarter-collapsed .prop-quarter-summary {
    display: block;
  }
</style>
{% endblock %}

{% block content %}
  {{ super() }}
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
function quarterCount(quarter) {
  return quarter.querySelectorAll('.prop-card').length;
}

function initQuarterCollapse() {
  var quarters = document.querySelectorAll('.prop-quarter:not([data-qinit])');
  quarters.forEach(function(q) {
    q.setAttribute('data-qinit', '1');
    var h2 = q.querySelector('h2');
    if (!h2) return;
    var summary = document.createElement('div');
    summary.className = 'prop-quarter-summary';
    summary.textContent = quarterCount(q) + ' proposals';
    h2.after(summary);
    h2.addEventListener('click', function() {
      q.classList.toggle('prop-quarter-collapsed');
      var collapsed = q.classList.contains('prop-quarter-collapsed');
      summary.textContent = collapsed
        ? quarterCount(q) + ' proposals \u2014 click to expand'
        : quarterCount(q) + ' proposals';
    });
  });
}

function initProposalsPage() {
  initQuarterCollapse();
  var checkboxes = document.querySelectorAll('.prop-oview-filter input[type=checkbox]');
  var cards = document.querySelectorAll('.prop-card');
  var countEl = document.querySelector('.prop-filter-count');
  function apply() {
    var filters = {};
    checkboxes.forEach(function(cb) {
      filters[cb.id.replace('prop-filter-', '')] = cb.checked;
    });
    var visible = 0;
    cards.forEach(function(card) {
      var status = card.getAttribute('data-status');
      var show = false;
      if (status === 'prop-passed' && filters.passed) show = true;
      else if (status === 'prop-rejected' && filters.rejected) show = true;
      else if (status === 'prop-voting' && filters.voting) show = true;
      else if (status === 'prop-failed' && filters.rejected) show = true;
      if (show && filters.funding) {
        show = card.querySelector('.prop-card-funding') !== null;
      }
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    countEl.textContent = visible + ' of ' + cards.length + ' proposals';
  }
  checkboxes.forEach(function(cb) { cb.addEventListener('change', apply); });
  apply();
}

initProposalsPage();
document$.subscribe(initProposalsPage);
</script>
{% endblock %}
