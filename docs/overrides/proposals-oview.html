{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<style>
  .md-sidebar--secondary {
    display: none !important;
  }

  .md-content {
    max-width: none !important;
  }
</style>
{% endblock %}

{% block content %}
  {{ super() }}
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
function initCountdowns() {
  document.querySelectorAll('.prop-vote-countdown').forEach(function(el) {
    var deadline = new Date(el.getAttribute('data-deadline'));
    function update() {
      var diff = deadline - new Date();
      if (diff <= 0) {
        el.textContent = 'Ended';
        el.classList.add('ended');
        return;
      }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);
      if (d > 0) el.textContent = d + 'd ' + h + 'h ' + m + 'm ' + s + 's';
      else if (h > 0) el.textContent = h + 'h ' + m + 'm ' + s + 's';
      else el.textContent = m + 'm ' + s + 's';
    }
    update();
    setInterval(update, 1000);
  });
}

function initProposalsPage() {
  var checkboxes = document.querySelectorAll('.prop-oview-filter input[type=checkbox]');
  var cards = document.querySelectorAll('.prop-card');
  var countEl = document.querySelector('.prop-filter-count');
  function apply() {
    var filters = {};
    checkboxes.forEach(function(cb) {
      filters[cb.id.replace('prop-filter-', '')] = cb.checked;
    });
    var visible = 0;
    cards.forEach(function(card) {
      var status = card.getAttribute('data-status');
      var show = false;
      if (status === 'prop-passed' && filters.passed) show = true;
      else if (status === 'prop-rejected' && filters.rejected) show = true;
      else if (status === 'prop-voting' && filters.voting) show = true;
      else if (status === 'prop-failed' && filters.rejected) show = true;
      if (show && filters.funding) {
        show = card.querySelector('.prop-card-funding') !== null;
      }
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    countEl.textContent = visible + ' of ' + cards.length + ' proposals';
  }
  checkboxes.forEach(function(cb) { cb.addEventListener('change', apply); });
  apply();
}

document$.subscribe(function() { initProposalsPage(); initCountdowns(); });
</script>
{% endblock %}
