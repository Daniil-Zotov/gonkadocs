{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<style>
.af-wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 1rem 0.5rem 3rem;
  font-size: 0.75rem;
  line-height: 1.45;
  color: #1f2328;
}

.af-lead {
  font-size: 0.78rem;
  color: #57606a;
  margin-bottom: 1.5rem;
  line-height: 1.45;
}

/* ── filters ──────────────────────────────────────────── */

.af-filters {
  margin-bottom: 1.5rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid #d1d9e0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  align-items: center;
}

.af-filter-cb {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: #57606a;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  transition: color 0.15s;
}

.af-filter-cb:hover { color: #1f2328; }

.af-filter-input {
  margin: 0;
  accent-color: #24292f;
}

.af-filter-count {
  margin-left: auto;
  font-size: 0.6rem;
  color: #8b949e;
}

/* ── timeline ─────────────────────────────────────────── */

.af-timeline {
  position: relative;
}

.af-day {
  position: relative;
  margin-bottom: 2rem;
}
.af-day:last-child { margin-bottom: 0; }
.af-day:first-child { margin-top: 1rem; }

.af-day-label {
  font-size: 0.68rem;
  font-weight: 700;
  color: #57606a;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 0.5rem;
  position: relative;
  padding-left: 38px;
  z-index: 2;
}

.af-day-line {
  position: absolute;
  left: 13px;
  top: 22px;
  bottom: 8px;
  width: 2px;
  background: #000000;
}

/* ── event row ─────────────────────────────────────────── */

.af-event {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  margin-bottom: 2rem;
  position: relative;
}
.af-event:last-child { margin-bottom: 0; }

.af-event-dot {
  justify-self: center;
  align-self: start;
  margin-top: 0.48em;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #000000;
  position: relative;
  z-index: 2;
}

.af-event-dot.new             { background: #1a7f37; }
.af-event-dot.deleted         { background: #cf222e; }
.af-event-dot.updated         { background: #0969da; }
.af-event-dot.status_changed  { background: #9a6700; }
.af-event-dot.quorum_reached  { background: #8250df; }

.af-event-card {
  font-size: 0.6rem;
  line-height: 1.4;
  color: #24292f;
}

.af-event-header {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  margin-bottom: 0.1rem;
}

.af-event-action {
  font-size: 0.55rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.af-event-action.new             { color: #1a7f37; }
.af-event-action.deleted         { color: #cf222e; }
.af-event-action.updated         { color: #0969da; }
.af-event-action.status_changed  { color: #9a6700; }
.af-event-action.quorum_reached  { color: #8250df; }

.af-event-section {
  font-size: 0.55rem;
  color: #8b949e;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.af-event-title {
  display: inline;
  font-size: 0.6rem;
  font-weight: 600;
  color: #1f2328;
  text-decoration: none;
  line-height: 1.4;
}

.af-event-title:hover {
  text-decoration: underline;
  color: #24292f;
}

.af-event-status {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  margin-top: 0.15rem;
  font-size: 0.55rem;
}

.af-status-badge {
  display: inline-block;
  padding: 0.05em 0.35em;
  border: 1px solid #d1d9e0;
  border-radius: 3px;
  font-size: 0.55rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: #57606a;
}

.af-status-badge.passed    { border-color: #1a7f37; color: #1a7f37; }
.af-status-badge.rejected  { border-color: #cf222e; color: #cf222e; }
.af-status-badge.failed    { border-color: #cf222e; color: #cf222e; }
.af-status-badge.voting    { border-color: #9a6700; color: #9a6700; }
.af-status-badge.deposit   { border-color: #0969da; color: #0969da; }
.af-status-badge.active    { border-color: #1a7f37; color: #1a7f37; }
.af-status-badge.expired   { border-color: #8b949e; color: #8b949e; }
.af-status-badge.open      { border-color: #1a7f37; color: #1a7f37; }
.af-status-badge.closed    { border-color: #8b949e; color: #8b949e; }

.af-event-ai {
  margin-top: 0.4rem;
  padding: 0.4rem 0.5rem;
  background: #f6f8fa;
  font-size: 0.6rem;
  line-height: 1.45;
  color: #24292f;
  border-radius: 2px;
}

.af-event-funding {
  margin-top: 0.2rem;
  font-size: 0.6rem;
  font-weight: 600;
  color: #1a7f37;
}

.af-event-time {
  margin-top: 0.2rem;
  font-size: 0.55rem;
  color: #8b949e;
}

/* ── states ────────────────────────────────────────────── */

.af-loading {
  text-align: center;
  padding: 2rem;
  font-size: 0.72rem;
  color: #8b949e;
}

.af-empty {
  text-align: center;
  padding: 3rem 1rem;
  font-size: 0.72rem;
  color: #8b949e;
}

.af-error {
  text-align: center;
  padding: 2rem;
  font-size: 0.72rem;
  color: #cf222e;
}

/* ── responsive ────────────────────────────────────────── */

@media (max-width: 600px) {
  .af-wrap { padding: 0.5rem 0.25rem 2rem; }
  .af-day-label { padding-left: 0; }
  .af-filters { gap: 0.25rem; }
}
</style>
{% endblock %}

{% block content %}
<div class="af-wrap">
  <p class="af-lead">Последние изменения в документации, пропозалах, дискуссиях и ишью.</p>

  <div class="af-filters" id="af-filters">
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="proposals" checked>
      Proposals
    </label>
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="preproposals" checked>
      Pre-Proposals
    </label>
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="discussions" checked>
      Discussions
    </label>
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="issues" checked>
      Issues
    </label>
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="gonka_docs" checked>
      Docs
    </label>
    <span class="af-filter-count" id="af-count"></span>
  </div>

  <div class="af-timeline" id="af-timeline"></div>
  <div class="af-loading" id="af-loading">Загрузка…</div>
  <div class="af-empty" id="af-empty" style="display:none">Нет событий по выбранным фильтрам.</div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
(function() {
  var TL = document.getElementById('af-timeline');
  var LOADING = document.getElementById('af-loading');
  var EMPTY = document.getElementById('af-empty');
  var COUNT = document.getElementById('af-count');
  var FILTERS = document.querySelectorAll('.af-filter-input');
  var EVENTS_URL = '{{ base_url }}/community/activity/events.json';

  function fmtTime(iso) {
    try {
      var d = new Date(iso);
      var now = new Date();
      var diff = now - d;
      if (diff < 0) return 'только что';
      var mins = Math.floor(diff / 60000);
      var hrs = Math.floor(diff / 3600000);
      var days = Math.floor(diff / 86400000);
      if (mins < 1) return 'только что';
      if (mins < 60) return mins + ' мин. назад';
      if (hrs < 24) return hrs + ' ч. назад';
      if (days < 7) return days + ' дн. назад';
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch(e) { return iso; }
  }

  function fmtDateGroup(iso) {
    try {
      var d = new Date(iso);
      var now = new Date();
      var diff = now - d;
      var days = Math.floor(diff / 86400000);
      if (days === 0) return 'Сегодня';
      if (days === 1) return 'Вчера';
      if (days < 7) return days + ' дн. назад';
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch(e) { return iso; }
  }

  function actionLabel(action) {
    return {
      'new': 'Добавлено',
      'deleted': 'Удалено',
      'updated': 'Обновлено',
      'status_changed': 'Статус изменён',
      'quorum_reached': 'Кворум достигнут'
    }[action] || action;
  }

  function render() {
    var active = {};
    FILTERS.forEach(function(cb) { active[cb.value] = cb.checked; });

    var data = window._afEvents || [];
    var filtered = data.filter(function(e) { return !!active[e.section]; });

    COUNT.textContent = filtered.length;
    EMPTY.style.display = filtered.length ? 'none' : 'block';

    if (!filtered.length) { TL.innerHTML = ''; return; }

    var groups = {};
    filtered.forEach(function(e) {
      var day = e.timestamp ? e.timestamp.slice(0, 10) : 'unknown';
      if (!groups[day]) groups[day] = [];
      groups[day].push(e);
    });

    var sortedDays = Object.keys(groups).sort().reverse();
    var html = '';

    sortedDays.forEach(function(day) {
      html += '<div class="af-day">';
      html += '<div class="af-day-label">' + fmtDateGroup(day) + '</div>';
      html += '<div class="af-day-line"></div>';

      groups[day].forEach(function(e) {
        var item = e.item || {};
        var details = e.details || {};
        var hasAI = e.ai_description && e.ai_description.length > 0;

        html += '<div class="af-event">';
        html += '<div class="af-event-dot ' + e.action + '"></div>';
        html += '<div class="af-event-card">';
        html += '<div class="af-event-header">';
        html += '<span class="af-event-action ' + e.action + '">' + actionLabel(e.action) + '</span>';
        html += '<span class="af-event-section">' + e.section + '</span>';
        html += '</div>';

        if (item.url) {
          html += '<a href="' + item.url + '" class="af-event-title">' + escHtml(item.title) + '</a>';
        } else {
          html += '<span class="af-event-title">' + escHtml(item.title) + '</span>';
        }

        if (e.action === 'status_changed' && details.status_before && details.status_after) {
          html += '<div class="af-event-status">';
          html += '<span class="af-status-badge ' + details.status_before + '">' + escHtml(details.status_before) + '</span>';
          html += ' → ';
          html += '<span class="af-status-badge ' + details.status_after + '">' + escHtml(details.status_after) + '</span>';
          html += '</div>';
        }

        if (details.funding) {
          html += '<div class="af-event-funding">' + escHtml(details.funding) + '</div>';
        }

        if (hasAI) {
          html += '<div class="af-event-ai">' + escHtml(e.ai_description) + '</div>';
        }

        html += '<div class="af-event-time">' + fmtTime(e.timestamp) + '</div>';
        html += '</div>';
        html += '</div>';
      });

      html += '</div>';
    });

    TL.innerHTML = html;
  }

  function escHtml(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function loadEvents() {
    LOADING.style.display = 'block';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', EVENTS_URL + '?_t=' + Date.now(), true);
    xhr.onload = function() {
      LOADING.style.display = 'none';
      if (xhr.status >= 200 && xhr.status < 400) {
        try {
          window._afEvents = JSON.parse(xhr.responseText);
          render();
        } catch(e) {
          TL.innerHTML = '<div class="af-error">Ошибка: ' + e.message + '</div>';
        }
      } else {
        TL.innerHTML = '<div class="af-error">Ошибка загрузки: ' + xhr.statusText + '</div>';
      }
    };
    xhr.onerror = function() {
      LOADING.style.display = 'none';
      TL.innerHTML = '<div class="af-error">Не удалось загрузить ленту.</div>';
    };
    xhr.send();
  }

  FILTERS.forEach(function(cb) { cb.addEventListener('change', render); });
  document$.subscribe(loadEvents);
  if (document.readyState !== 'loading') loadEvents();
})();
</script>
{% endblock %}
