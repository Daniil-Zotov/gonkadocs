{% extends "main.html" %}

{% block extrahead %}
{{ super() }}
{% endblock %}

{% block content %}
<div class="af-wrap">
  <p class="af-lead">Recent changes in documentation, proposals, discussions and issues.</p>

  <div class="af-filters" id="af-filters">
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="proposals" checked>
      Proposals
    </label>
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="preproposals" checked>
      Pre-Proposals
    </label>
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="discussions" checked>
      Discussions
    </label>
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="issues" checked>
      Issues
    </label>
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="gonka_docs" checked>
      Docs
    </label>
    <label class="af-filter-cb">
      <input type="checkbox" class="af-filter-input" value="calendar" checked>
      Calendar
    </label>
    <span class="af-filter-count" id="af-count"></span>
  </div>

  <div class="af-timeline" id="af-timeline"></div>
  <div class="af-loading" id="af-loading">Loading…</div>
  <div class="af-empty" id="af-empty" style="display:none">No events match the selected filters.</div>
</div>

<script>
(function() {
  var TL = document.getElementById('af-timeline');
  var LOADING = document.getElementById('af-loading');
  var EMPTY = document.getElementById('af-empty');
  var COUNT = document.getElementById('af-count');
  var FILTERS = document.querySelectorAll('.af-filter-input');
  var EVENTS_URL = '{{ base_url }}/community/activity/events.json';

  function fmtTime(iso) {
    try {
      var d = new Date(iso);
      var now = new Date();
      var diff = now - d;
      if (diff < 0) return 'just now';
      var mins = Math.floor(diff / 60000);
      var hrs = Math.floor(diff / 3600000);
      var days = Math.floor(diff / 86400000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + ' min ago';
      if (hrs < 24) return hrs + ' h ago';
      if (days < 7) return days + ' d ago';
      return d.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch(e) { return iso; }
  }

  function fmtDateGroup(iso) {
    try {
      var d = new Date(iso);
      var now = new Date();
      var diff = now - d;
      var days = Math.floor(diff / 86400000);
      if (days === 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 7) return days + ' d ago';
      return d.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch(e) { return iso; }
  }

  function actionLabel(action) {
    return {
      'new': 'Added',
      'deleted': 'Deleted',
      'updated': 'Updated',
      'status_changed': 'Status changed',
      'quorum_reached': 'Quorum reached',
      'daily_reminder': 'Today'
    }[action] || action;
  }

  function sectionLabel(section) {
    return {
      'proposals': 'Proposals',
      'preproposals': 'Pre-Proposals',
      'discussions': 'Discussions',
      'issues': 'Issues',
      'gonka_docs': 'Docs',
      'calendar': 'Calendar'
    }[section] || section;
  }

  function fmtDateTime(details) {
    var s = '';
    if (details.date) s += details.date;
    if (details.time) s += (s ? ' ' : '') + details.time;
    if (details.event_type) s += (s ? ' · ' : '') + details.event_type;
    return s;
  }

  function render() {
    var active = {};
    FILTERS.forEach(function(cb) { active[cb.value] = cb.checked; });

    var data = window._afEvents || [];
    var filtered = data.filter(function(e) { return !!active[e.section]; });

    COUNT.textContent = filtered.length;
    EMPTY.style.display = filtered.length ? 'none' : 'block';

    if (!filtered.length) { TL.innerHTML = ''; return; }

    var groups = {};
    filtered.forEach(function(e) {
      var day = e.timestamp ? e.timestamp.slice(0, 10) : 'unknown';
      if (!groups[day]) groups[day] = [];
      groups[day].push(e);
    });

    var sortedDays = Object.keys(groups).sort().reverse();
    var html = '';

    sortedDays.forEach(function(day) {
      html += '<div class="af-day">';
      html += '<div class="af-day-label">' + fmtDateGroup(day) + '</div>';
      html += '<div class="af-day-line"></div>';

      groups[day].forEach(function(e) {
        var item = e.item || {};
        var details = e.details || {};
        var hasAI = e.ai_description && e.ai_description.length > 0;

        html += '<div class="af-event">';
        html += '<div class="af-event-dot ' + e.action + '"></div>';
        html += '<div class="af-event-card">';
        html += '<div class="af-event-header">';
        html += '<span class="af-event-action ' + e.action + '">' + actionLabel(e.action) + '</span>';
        html += '<span class="af-event-section">' + sectionLabel(e.section) + '</span>';
        html += '</div>';

        if (item.url) {
          html += '<a href="' + item.url + '" class="af-event-title">' + escHtml(item.title) + '</a>';
        } else {
          html += '<span class="af-event-title">' + escHtml(item.title) + '</span>';
        }

        if (e.section === 'calendar' && e.action === 'daily_reminder' && details.today && details.today.length) {
          html += '<div class="af-reminder">';
          details.today.forEach(function(ev) {
            html += '<div class="af-reminder-item">';
            var when = ev.date || '';
            if (ev.time) when += (when ? ' ' : '') + ev.time;
            html += '<span class="af-reminder-when">' + escHtml(when) + '</span>';
            if (ev.url) {
              html += ' <a href="' + ev.url + '">' + escHtml(ev.title) + '</a>';
            } else {
              html += ' ' + escHtml(ev.title);
            }
            html += '</div>';
          });
          html += '</div>';
        }

        if (e.action === 'status_changed' && details.status_before && details.status_after) {
          html += '<div class="af-event-status">';
          html += '<span class="af-status-badge ' + details.status_before + '">' + escHtml(details.status_before) + '</span>';
          html += ' → ';
          html += '<span class="af-status-badge ' + details.status_after + '">' + escHtml(details.status_after) + '</span>';
          html += '</div>';
        }

        if (details.funding) {
          html += '<div class="af-event-funding">' + escHtml(details.funding) + '</div>';
        }

        if (e.section === 'calendar' && details.date) {
          var when = fmtDateTime(details);
          if (when) {
            html += '<div class="af-event-when">' + escHtml(when) + '</div>';
          }
        }

        if (hasAI) {
          var cleanAI = e.ai_description
            .replace(/<think>[\s\S]*?<\/think>/gi, '')
            .replace(/<[^>]+>/g, '')
            .trim();
          if (cleanAI) {
            html += '<div class="af-event-ai">' + cleanAI + '</div>';
          }
        }

        html += '<div class="af-event-time">' + fmtTime(e.timestamp) + '</div>';
        html += '</div>';
        html += '</div>';
      });

      html += '</div>';
    });

    TL.innerHTML = html;
  }

  function escHtml(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function loadEvents() {
    LOADING.style.display = 'block';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', EVENTS_URL + '?_t=' + Date.now(), true);
    xhr.onload = function() {
      LOADING.style.display = 'none';
      if (xhr.status >= 200 && xhr.status < 400) {
        try {
          window._afEvents = JSON.parse(xhr.responseText);
          render();
        } catch(e) {
          TL.innerHTML = '<div class="af-error">Error: ' + e.message + '</div>';
        }
      } else {
        TL.innerHTML = '<div class="af-error">Failed to load: ' + xhr.statusText + '</div>';
      }
    };
    xhr.onerror = function() {
      LOADING.style.display = 'none';
      TL.innerHTML = '<div class="af-error">Could not load the feed.</div>';
    };
    xhr.send();
  }

  FILTERS.forEach(function(cb) { cb.addEventListener('change', render); });
  loadEvents();
  document$.subscribe(loadEvents);
})();
</script>
{% endblock %}
