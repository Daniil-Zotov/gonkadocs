{# Issues sidebar — shows labels with counts #}
<div class="md-sidebar md-sidebar--issues" data-md-component="sidebar" data-md-type="custom">
  <div class="md-sidebar__scrollwrap">
    <div class="md-sidebar__inner">
      <nav class="md-nav md-nav--issues" aria-label="Issues">
        <label class="md-nav__title" for="__issues_drawer">
          <span class="md-nav__icon md-icon"></span>
          Issues
        </label>
        <ul class="md-nav__list" data-md-scrollfix>
          <li class="md-nav__item">
            <a href="/community/issues/" class="md-nav__link">
              <span class="md-ellipsis">All Issues</span>
            </a>
          </li>
          <li class="md-nav__item md-nav__item--separator" style="margin: 8px 0; border-top: 1px solid var(--md-default-fg-color--lightest);"></li>
          <li class="md-nav__item md-nav__item--label" style="font-size: 12px; font-weight: 600; color: var(--md-default-fg-color--light); padding: 4px 16px; text-transform: uppercase; letter-spacing: 0.5px;">
            Labels
          </li>
          <!-- Labels will be populated by JavaScript from labels.json -->
          <div id="issues-labels-nav"></div>
        </ul>
      </nav>
    </div>
  </div>
</div>

<script>
(function() {
  // Try to load labels.json from the same directory or parent
  const scripts = document.scripts;
  const currentPath = window.location.pathname;
  let basePath = '/community/issues/';

  // Determine base path
  if (currentPath.includes('/labels/')) {
    basePath = '/community/issues/';
  } else if (currentPath.match(/\/community\/issues\/\d/)) {
    basePath = '/community/issues/';
  }

  fetch(basePath + 'labels.json')
    .then(r => r.json())
    .then(labels => {
      const container = document.getElementById('issues-labels-nav');
      if (!container || !labels.length) return;

      const sorted = labels.sort((a, b) => b.count - a.count);
      let html = '';
      for (const label of sorted) {
        const url = basePath + 'labels/' + label.slug + '/';
        html += '<li class="md-nav__item">';
        html += '<a href="' + url + '" class="md-nav__link">';
        html += '<span class="md-ellipsis">';
        html += '<span class="issues-label" style="display:inline-flex; font-size:11px; padding:1px 6px;">' + label.name + '</span> ';
        html += '<span class="issues-label-count">' + label.count + '</span>';
        html += '</span>';
        html += '</a>';
        html += '</li>';
      }
      container.innerHTML = html;
    })
    .catch(() => {});
})();
</script>
