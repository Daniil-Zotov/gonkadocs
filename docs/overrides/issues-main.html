{% extends "base.html" %}

{% block extrahead %}
<style>
  .md-sidebar--secondary {
    display: none !important;
  }

  @media screen and (min-width: 76.25em) {
    .md-sidebar--primary {
      height: auto !important;
    }
  }

  .md-content {
    display: flex;
    gap: 0;
  }

  .md-content__inner {
    flex: 1;
    min-width: 0;
  }

  .md-sidebar--issues {
    position: sticky;
    top: 76px;
    height: calc(100vh - 76px);
    overflow-y: auto;
    flex-shrink: 0;
    width: 240px;
    min-width: 240px;
    border-left: 1px solid var(--md-default-fg-color--lightest);
    padding: 16px 0;
  }

  @media (max-width: 1200px) {
    .md-sidebar--issues {
      display: none;
    }
  }

  .md-nav--issues .md-nav__link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    font-size: 14px;
  }

  .md-nav--issues .md-nav__link--active {
    font-weight: 600;
  }

  .issues-label-count {
    font-size: 12px;
    color: var(--md-default-fg-color--light);
    margin-left: auto;
  }

  .issues-filter {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    margin-bottom: 16px;
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 6px;
    background: var(--md-code-bg-color);
    font-size: 14px;
  }

  .issues-filter label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  .issues-filter input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .issues-filter-count {
    margin-left: auto;
    font-size: 13px;
    color: var(--md-default-fg-color--light);
  }
</style>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Expand Community section and highlight Issues on issue pages
  var currentPath = window.location.pathname;

  if (currentPath.indexOf('/community/issues/') !== -1) {
    // Find all nav items and expand the Community section
    var navItems = document.querySelectorAll('.md-nav--primary .md-nav__item');
    navItems.forEach(function(item) {
      var link = item.querySelector('.md-nav__link');
      if (link) {
        var href = link.getAttribute('href');
        // Expand Community section
        if (href && href.indexOf('/community/') !== -1 && href.indexOf('/community/issues/') === -1) {
          item.classList.add('md-nav__item--active');
          var toggle = item.querySelector('.md-nav__toggle');
          if (toggle) toggle.checked = true;
        }
      }
    });

    // Mark Issues link as active
    var issuesLinks = document.querySelectorAll('.md-nav--primary .md-nav__link');
    issuesLinks.forEach(function(link) {
      var href = link.getAttribute('href');
      if (href && href.indexOf('/community/issues/') !== -1 && href.indexOf('/community/issues/labels/') === -1) {
        link.classList.add('md-nav__link--active');
      }
    });
  }

  // Move issues sidebar out of article to be sibling inside md-content
  var sidebar = document.querySelector('.md-sidebar--issues');
  var content = document.querySelector('.md-content');
  if (sidebar && content) {
    content.appendChild(sidebar);
  }

  // Open/Closed filter for issues list
  var list = document.querySelector('.issues-list');
  if (!list) return;
  var items = list.querySelectorAll('.issues-list-item');
  if (!items.length) return;

  var filter = document.createElement('div');
  filter.className = 'issues-filter';
  filter.innerHTML =
    '<label><input type="checkbox" id="issues-show-open" checked> Show Open</label>' +
    '<label><input type="checkbox" id="issues-show-closed"> Show Closed</label>' +
    '<span class="issues-filter-count"></span>';
  list.parentNode.insertBefore(filter, list);

  var cbOpen = document.getElementById('issues-show-open');
  var cbClosed = document.getElementById('issues-show-closed');
  var countEl = filter.querySelector('.issues-filter-count');

  function applyFilter() {
    var showOpen = cbOpen.checked;
    var showClosed = cbClosed.checked;
    var visible = 0;
    items.forEach(function(item) {
      var isOpen = item.querySelector('.issues-status-open') !== null;
      var show = (isOpen && showOpen) || (!isOpen && showClosed);
      item.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    countEl.textContent = visible + ' of ' + items.length + ' issues';
  }

  cbOpen.addEventListener('change', applyFilter);
  cbClosed.addEventListener('change', applyFilter);
  applyFilter();
});
</script>
{% endblock %}

{% block content %}
  {{ super() }}
  {% include "partials/issues-sidebar.html" %}
{% endblock %}
