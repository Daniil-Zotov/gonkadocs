{% extends "base.html" %}

{% block extra %}
<style>
  .md-sidebar--secondary {
    display: none !important;
  }

  /* Make md-content a flex container so issues sidebar sits beside the article */
  .md-content {
    display: flex;
    gap: 0;
  }

  .md-content__inner {
    flex: 1;
    min-width: 0;
  }

  /* Issues sidebar inside md-content, right side */
  .md-sidebar--issues {
    position: sticky;
    top: 76px;
    height: calc(100vh - 76px);
    overflow-y: auto;
    flex-shrink: 0;
    width: 240px;
    min-width: 240px;
    border-left: 1px solid var(--md-default-fg-color--lightest);
    padding: 16px 0;
  }

  @media (max-width: 1200px) {
    .md-sidebar--issues {
      display: none;
    }
  }

  .md-nav--issues .md-nav__link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    font-size: 14px;
  }

  .md-nav--issues .md-nav__link--active {
    font-weight: 600;
  }

  .issues-label-count {
    font-size: 12px;
    color: var(--md-default-fg-color--light);
    margin-left: auto;
  }

  /* Issue filter bar */
  .issues-filter {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    margin-bottom: 16px;
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 6px;
    background: var(--md-code-bg-color);
    font-size: 14px;
  }

  .issues-filter label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  .issues-filter input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .issues-filter-count {
    margin-left: auto;
    font-size: 13px;
    color: var(--md-default-fg-color--light);
  }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Filter checkboxes
  var list = document.querySelector('.issues-list');
  if (list) {
    var items = list.querySelectorAll('.issues-list-item');
    if (items.length) {
      var filter = document.createElement('div');
      filter.className = 'issues-filter';
      filter.innerHTML =
        '<label><input type="checkbox" id="issues-show-open" checked> Показать открытые</label>' +
        '<label><input type="checkbox" id="issues-show-closed"> Показать закрытые</label>' +
        '<span class="issues-filter-count"></span>';
      list.parentNode.insertBefore(filter, list);

      var cbOpen = document.getElementById('issues-show-open');
      var cbClosed = document.getElementById('issues-show-closed');
      var countEl = filter.querySelector('.issues-filter-count');

      function applyFilter() {
        var showOpen = cbOpen.checked;
        var showClosed = cbClosed.checked;
        var visible = 0;
        items.forEach(function(item) {
          var isOpen = item.querySelector('.issues-status-open') !== null;
          var show = (isOpen && showOpen) || (!isOpen && showClosed);
          item.style.display = show ? '' : 'none';
          if (show) visible++;
        });
        countEl.textContent = visible + ' из ' + items.length + ' issues';
      }

      cbOpen.addEventListener('change', applyFilter);
      cbClosed.addEventListener('change', applyFilter);
      applyFilter();
    }
  }
});
</script>
{% endblock %}

{% block content %}
  {{ super() }}
  {% include "partials/issues-sidebar.html" %}
{% endblock %}
