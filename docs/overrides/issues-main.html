{% extends "base.html" %}

{% block extra %}
<style>
  /* Hide the default table of contents sidebar on issue pages */
  .md-sidebar--secondary {
    display: none !important;
  }

  /* Issues sidebar styling (element is moved via JS to md-main__inner) */
  .md-sidebar--issues {
    position: sticky;
    top: 76px;
    height: calc(100vh - 76px);
    overflow-y: auto;
    flex-shrink: 0;
    width: 260px;
    min-width: 260px;
    border-left: 1px solid var(--md-default-fg-color--lightest);
    padding: 16px 0;
  }

  @media (max-width: 1200px) {
    .md-sidebar--issues {
      display: none;
    }
  }

  .md-nav--issues .md-nav__link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    font-size: 14px;
  }

  .md-nav--issues .md-nav__link--active {
    font-weight: 600;
  }

  .issues-label-count {
    font-size: 12px;
    color: var(--md-default-fg-color--light);
    margin-left: auto;
  }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var sidebar = document.querySelector('.md-sidebar--issues');
  var mainInner = document.querySelector('.md-main__inner');
  if (sidebar && mainInner) {
    mainInner.appendChild(sidebar);
  }
});
</script>
{% endblock %}

{% block content %}
  {{ super() }}
  {% include "partials/issues-sidebar.html" %}
{% endblock %}
