{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<style>
  .md-sidebar--secondary {
    display: none !important;
  }

  /* Override global max-width on issues pages */
  .md-content {
    max-width: none !important;
  }

  .issues-sidebar {
    display: block;
    position: sticky;
    top: 76px;
    align-self: flex-start;
    height: calc(100vh - 76px);
    overflow-y: hidden;
    flex-shrink: 0;
    width: 240px;
    min-width: 240px;
    border-left: 1px solid var(--md-default-fg-color--lightest);
    padding: 16px 0;
  }

  @media (max-width: 1200px) {
    .issues-sidebar {
      display: none;
    }
  }

  .md-nav--issues .md-nav__link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    font-size: 14px;
  }

  .md-nav--issues .md-nav__link--active {
    font-weight: 600;
  }

  .issues-label-count {
    font-size: 12px;
    color: var(--md-default-fg-color--light);
    margin-left: auto;
  }

  .issues-filter {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    margin-bottom: 16px;
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 6px;
    background: var(--md-code-bg-color);
    font-size: 14px;
  }

  .issues-filter label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  .issues-filter input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .issues-filter-count {
    margin-left: auto;
    font-size: 13px;
    color: var(--md-default-fg-color--light);
  }
</style>
{% endblock %}

{% block content %}
  {{ super() }}
  {% include "partials/issues-sidebar.html" %}
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
function initIssuePage() {
  var content = document.querySelector('.md-content');
  if (!content) return;

  // Remove stale sidebars from previous instant loads
  document.querySelectorAll('.md-content > .issues-sidebar').forEach(function(el) {
    el.remove();
  });

  // Ensure content is in flex row
  content.style.display = 'flex';
  content.style.flexDirection = 'row';

  // Move sidebar from article to be sibling of article
  var inner = content.querySelector('.md-content__inner');
  var sidebar = inner ? inner.querySelector('.issues-sidebar') : null;
  if (sidebar) {
    content.appendChild(sidebar);
  }

  // Open/Closed filter
  var list = document.querySelector('.issues-list');
  if (!list) return;
  var items = list.querySelectorAll('.issues-list-item');
  if (!items.length) return;

  var existingFilter = list.parentNode.querySelector(':scope > .issues-filter');
  if (existingFilter) existingFilter.remove();

  var filter = document.createElement('div');
  filter.className = 'issues-filter';
  filter.innerHTML =
    '<label><input type="checkbox" id="issues-show-open" checked> Show Open</label>' +
    '<label><input type="checkbox" id="issues-show-closed"> Show Closed</label>' +
    '<span class="issues-filter-count"></span>';
  list.parentNode.insertBefore(filter, list);

  var cbOpen = document.getElementById('issues-show-open');
  var cbClosed = document.getElementById('issues-show-closed');
  var countEl = filter.querySelector('.issues-filter-count');

  function applyFilter() {
    var showOpen = cbOpen.checked;
    var showClosed = cbClosed.checked;
    var visible = 0;
    items.forEach(function(item) {
      var isOpen = item.querySelector('.issues-status-open') !== null;
      var show = (isOpen && showOpen) || (!isOpen && showClosed);
      item.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    countEl.textContent = visible + ' of ' + items.length + ' issues';
  }

  cbOpen.addEventListener('change', applyFilter);
  cbClosed.addEventListener('change', applyFilter);
  applyFilter();
}

document$.subscribe(function() {
  initIssuePage();
  setTimeout(initIssuePage, 50);
});
</script>
{% endblock %}
