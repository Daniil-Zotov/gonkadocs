{% extends "base.html" %}

{% block extra %}
<style>
  .md-main__inner {
    display: flex;
    gap: 0;
  }

  .md-sidebar--issues {
    position: sticky;
    top: 76px;
    height: calc(100vh - 76px);
    overflow-y: auto;
    flex-shrink: 0;
    width: 280px;
    border-right: 1px solid var(--md-default-fg-color--lightest);
  }

  @media (max-width: 768px) {
    .md-sidebar--issues {
      display: none;
    }
  }

  .md-content {
    flex: 1;
    min-width: 0;
  }

  /* Hide the default table of contents sidebar on issue pages */
  .md-sidebar--secondary {
    display: none !important;
  }

  .md-nav--issues .md-nav__link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    font-size: 14px;
  }

  .md-nav--issues .md-nav__link--active {
    font-weight: 600;
  }

  .issues-label-count {
    font-size: 12px;
    color: var(--md-default-fg-color--light);
    margin-left: auto;
  }
</style>
{% endblock %}

{% block content %}
  {{ super() }}
  {% include "partials/issues-sidebar.html" %}
{% endblock %}
