{% extends "base.html" %}

{% block extrahead %}
<style>
  .preproposal-header {
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 24px;
    background: var(--md-code-bg-color);
    font-size: 14px;
    line-height: 1.8;
  }

  .preproposal-header p {
    margin: 0;
  }

  .preproposal-header strong {
    color: var(--md-default-fg-color);
  }

  .preproposal-status {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .preproposal-link {
    margin-top: 24px;
    padding: 12px 16px;
    background: var(--md-code-bg-color);
    border: 1px solid var(--md-default-fg-color--lightest);
    border-radius: 6px;
    font-size: 14px;
  }

  .preproposal-link a {
    color: var(--md-accent-fg-color);
    text-decoration: none;
    font-weight: 500;
  }

  .preproposal-link a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}

{% block content %}
  {{ super() }}
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
function initCountdowns() {
  document.querySelectorAll('.prop-vote-countdown').forEach(function(el) {
    var deadline = new Date(el.getAttribute('data-deadline'));
    function update() {
      var diff = deadline - new Date();
      if (diff <= 0) {
        el.textContent = 'Ended';
        el.classList.add('ended');
        return;
      }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      if (d > 0) el.textContent = d + 'd ' + h + 'h ' + m + 'm';
      else if (h > 0) el.textContent = h + 'h ' + m + 'm';
      else el.textContent = m + 'm';
    }
    update();
    setInterval(update, 60000);
  });
}

document$.subscribe(initCountdowns);
initCountdowns();
</script>
{% endblock %}
