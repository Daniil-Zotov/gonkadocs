<nav class="md-tabs" aria-label="Tabs" data-md-component="tabs">
  <div class="md-grid">
    <ul class="md-tabs__list">
      <li class="md-tabs__item md-tabs__item--active">
        <a href="/gonka/docs/" class="md-tabs__link">Gonka.ai/docs</a>
      </li>
      <li class="md-tabs__item">
        <a href="/community/" class="md-tabs__link">Community</a>
      </li>
      <li class="md-tabs__item">
        <a href="/proposals/" class="md-tabs__link">Proposals</a>
      </li>
      <li class="md-tabs__item">
        <a href="/agents/" class="md-tabs__link">For Agents</a>
      </li>
    </ul>
  </div>
</nav>

<script>
(function() {
  function updateActiveTab() {
    var path = window.location.pathname;
    var tabs = document.querySelectorAll('.md-tabs__item');
    tabs.forEach(function(t) { t.classList.remove('md-tabs__item--active'); });
    if (path.startsWith('/gonka/docs/')) {
      if (tabs[0]) tabs[0].classList.add('md-tabs__item--active');
    } else if (path.startsWith('/community/')) {
      if (tabs[1]) tabs[1].classList.add('md-tabs__item--active');
    } else if (path.startsWith('/proposals/')) {
      if (tabs[2]) tabs[2].classList.add('md-tabs__item--active');
    } else if (path.startsWith('/agents/')) {
      if (tabs[3]) tabs[3].classList.add('md-tabs__item--active');
    }
  }
  updateActiveTab();
  if (typeof document$ !== 'undefined') {
    document$.subscribe(function() { setTimeout(updateActiveTab, 50); });
  }
})();
</script>
