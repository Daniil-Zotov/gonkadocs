site_name: Gonka Docs
site_url: https://gonkadocs.com/
site_description: "Документация Gonka.ai: архитектура децентрализованного AI-инференса, запуск нод, интеграция API, кошелёк, управление сообществом и голосование за предложения."
repo_url: https://github.com/Daniil-Zotov/gonkadocs
repo_name: Daniil-Zotov/gonkadocs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: _site

# Раздел "Gonka" (docs/gonka/docs/**) собирается ОТДЕЛЬНО родным mkdocs.yml
# оригинала (gonka-ai/gonka-docs) в подкаталог _site/gonka/ через
# buildtools/build.sh. Поэтому исключаем его из основной сборки, чтобы не
# дублировать контент и не ловить "not in nav" предупреждения.
exclude_docs: |
  gonka/docs/

# Отдельные посты обсуждений и страницы community доступны по ссылкам из
# индексных страниц, но намеренно не входят в nav-меню напрямую.
not_in_nav: |
  community/discussion/**/*.md
  community/issues/**/*.md
  community/**/*.md
  proposals/preproposals/**/*.md
  agents.md
  index.md
  README.md

nav:
  - Gonka.ai/docs: "/gonka/docs/"
  - Community:
    - Обзор: community/README.md
    - Roadmap: 
      - Overview: community/roadmap/README.md
    - "Governance Support Committee": 
      - Overview: community/governance support committee/README.md  
    - "Gonka Product Committee": 
      - Overview: community/gonka product committee/README.md
    - "Go-to-Market Committee":
      - Overview: community/go-to-market committee/README.md
      - Members: community/go-to-market committee/members.md      
    - "Gonka Restitution Committee": 
      - Overview: community/gonka restitution committee/README.md
    - Discussions:
      - Overview: community/discussion/index.md
      - Announcements: community/discussion/announcements/index.md
      - General: community/discussion/general/index.md
      - Proposals: community/discussion/proposals/index.md
      - Q&A: community/discussion/q-a/index.md
      - Show and Tell: community/discussion/show-and-tell/index.md
    - Issues:
      - Overview: community/issues/index.md
