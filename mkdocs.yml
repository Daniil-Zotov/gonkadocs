  - hooks/issues_nav.py
  - hooks/proposals_nav.py

extra_css:
  - stylesheets/github.css
  - stylesheets/issues.css
  - stylesheets/proposals.css

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret

extra:
  tabs:
    - title: Gonka.ai/docs
      url: /gonka/docs/
    - title: Community
      url: /community/
    - title: Proposals
      url: /proposals/proposals/
    - title: For Agents
      url: /agents/
  comments: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Daniil-Zotov/gonkadocs

validation:
  omitted_files: warn
  absolute_links: ignore        # absolute_links - это те самые "/governance/..." из апстрима
  unrecognized_links: info
  anchors: info                 # битые якоря (#section) - только info, не warn
