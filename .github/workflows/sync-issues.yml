name: Sync gonka-ai/gonka Issues

on:
  schedule:
    - cron: "25 */1 * * *"   # every hour at :25
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests markdown

      - name: Snapshot before sync (activity feed)
        run: python3 buildtools/activity-feed.py snapshot --dir docs/community/issues --section issues --manifest .feed-manifests/issues.json

      - name: Sync all issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: gonka-ai
          REPO_NAME: gonka
          OUTPUT_DIR: docs/community/issues
        run: python .github/scripts/sync_gonka_issues.py

      - name: Detect changes after sync (activity feed)
        run: python3 buildtools/activity-feed.py detect --dir docs/community/issues --section issues --manifest .feed-manifests/issues.json --events docs/community/activity/events.json --ai
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_ENDPOINT: "https://api.proxy.gonka.gg/v1"
          AI_MODEL: "moonshotai/Kimi-K2.6"

      - name: Regenerate AI-agent files (llms.txt, llms-full.txt)
        run: |
          python3 buildtools/generate-llms.py
          python3 buildtools/generate-llms-full.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/community/issues/ docs/llms.txt docs/llms-full.txt docs/community/activity/events.json .feed-manifests/issues.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore(docs): sync gonka-ai/gonka Issues + regenerate llms files"
            git pull --rebase -X theirs --autostash origin main
            git push
          fi
