name: Sync On-Chain Proposals

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Snapshot before sync (activity feed)
        run: python3 buildtools/activity-feed.py snapshot --dir docs/proposals/proposals --section proposals --manifest .feed-manifests/proposals.json

      - name: Sync on-chain proposals
        run: python .github/scripts/sync_onchain_proposals.py

      - name: Detect changes after sync (activity feed)
        run: python3 buildtools/activity-feed.py detect --dir docs/proposals/proposals --section proposals --manifest .feed-manifests/proposals.json --events docs/community/activity/events.json --ai
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_ENDPOINT: "https://api.proxy.gonka.gg/v1"
          AI_MODEL: "moonshotai/Kimi-K2.6"

      - name: Commit changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/proposals/proposals/ mkdocs.yml docs/community/activity/events.json .feed-manifests/proposals.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(docs): sync on-chain governance proposals from mainnet"
            git pull --rebase -X theirs origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site rebuild
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy-docs.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
