name: Sync gonka-ai/docs from upstream

on:
  schedule:
    - cron: '0 */1 * * *'   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4

      - name: Clone upstream repo (shallow)
        run: |
          git clone --depth=1 https://github.com/gonka-ai/gonka-docs.git upstream-tmp

      - name: Remove upstream .git metadata
        run: |
          rm -rf upstream-tmp/.git

      - name: Install Python dependencies
        run: pip install --quiet requests

      - name: Snapshot before sync (activity feed)
        run: python3 buildtools/activity-feed.py snapshot --dir docs/gonka/docs/docs --section gonka_docs --manifest .feed-manifests/gonka_docs.json

      - name: Copy full upstream content
        run: |
          mkdir -p docs/gonka
          rm -rf docs/gonka/docs
          mkdir -p docs/gonka/docs
          cp -a upstream-tmp/. docs/gonka/docs/
          rm -rf upstream-tmp

      - name: Detect changes after sync (activity feed)
        run: python3 buildtools/activity-feed.py detect --dir docs/gonka/docs/docs --section gonka_docs --manifest .feed-manifests/gonka_docs.json --events docs/community/activity/events.json --ai
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_ENDPOINT: "https://api.proxy.gonka.gg/v1"
          AI_MODEL: "moonshotai/Kimi-K2.6"

      - name: Regenerate AI-agent files (llms.txt, llms-full.txt)
        run: |
          python3 buildtools/generate-llms.py
          python3 buildtools/generate-llms-full.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gonka/docs docs/llms.txt docs/llms-full.txt docs/community/activity/events.json .feed-manifests/gonka_docs.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to push"
          else
            git commit -m "chore: sync docs/gonka/docs + regenerate llms files from gonka-ai/gonka-docs@$(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase -X theirs --autostash origin main
            git push
          fi
