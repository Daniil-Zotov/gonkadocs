name: Update Community Pool Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update community pool balances and spend history
        run: python3 buildtools/update-community-pool.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/proposals/community\ pool.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(docs): update community pool balances and spend history"
            git pull --rebase -X theirs --autostash origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
